name: itso-quiz-bee

services:
  postgres:
    image: postgres:16-alpine
    container_name: itso-quiz-bee-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: itso_quiz_bee
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itso-network

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: itso-quiz-bee-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itso-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: itso-quiz-bee-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env
    ports:
      - 3002:3002
    networks:
      - itso-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: itso-quiz-bee-web
    depends_on:
      - backend
    env_file:
      - ./client/.env
    ports:
      - 3000:3000
    networks:
      - itso-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  itso-network:
    driver: bridge
