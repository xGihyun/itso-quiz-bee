version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: itso-quiz-bee-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-itso_quiz_bee}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itso-network

  redis:
    image: redis/redis-stack:latest
    container_name: itso-quiz-bee-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itso-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: itso-quiz-bee-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-itso_quiz_bee}
      REDIS_URL: redis://redis:6379
      PORT: ${BACKEND_PORT:-3002}
      HOST: 0.0.0.0
      FRONTEND_PORT: ${FRONTEND_PORT:-3001}
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    networks:
      - itso-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:${BACKEND_PORT:-3002}
    container_name: itso-quiz-bee-web
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    networks:
      - itso-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  itso-network:
    driver: bridge
